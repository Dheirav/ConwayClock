; Life Clock settings. Edit and save: the wallpaper reloads this file within 2 s.
; Nothing here costs CPU while running; colours and layout are applied once per change.

; Frames per second: 3, 6, 12 or 24 (generations per frame = 192 / fps). Lower = less CPU.
fps = 6
; Frame rate while on battery: 1, 3, 6, 12 or 24.
battery_fps = 3

; whole = the machine (top cropped depending on vpos), display = just the 7-segment display.
view = whole
; Size relative to the largest fit (1.0 = fills the screen width; >1 crops; 0.5 = half).
size = 1.0
; Where the digits' centre sits: fraction of the screen width / height.
hpos = 0.5
vpos = 0.5
; Monitor index (0 = primary).
monitor = 0

; Colours. palette = amber | green | white | blue | red, or set bg / cells / cells2 yourself
; (RRGGBB). cells2, if set, is the colour of the densest areas (two-tone ramp); 'none' disables.
palette = amber
; bg = 07090f
; cells = ffe9a8
cells2 = none
; Brightness of one live cell in a zoomed-out pixel (5-120).
gain = 40

; AM/PM: the machine has a box that is an outline in the morning and filled in the afternoon,
; next to a static 'PM' label. dot = a filled dot beside the digits when PM, nothing when AM,
; read from that box (default); text = keep the box and write AM/PM; machine = as drawn; hide.
pm = dot
; The colon: pulse = the pattern's still-life discs replaced by discs of pulsars (period-3
; oscillators) so the dots breathe under Life's rules (default); machine = as drawn; hide.
colon = pulse

; Afterglow: 0 = off; 0.5-0.9 leaves fading trails behind moving cells (one cheap pass per frame).
afterglow = 0

; Zoom: auto fits the view to the screen (1/8 for the whole machine); 8, 4, 2 or 1 fix
; cells per pixel, centred on the digits (hpos/vpos still apply). 4 shows individual gliders.
zoom = auto

; Small stats line in the corner: 0 or 1.
status = 0
